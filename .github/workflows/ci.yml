name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate config.json structure
        run: |
          jq -e '
            (.shared.vscode_theme | type == "string") and
            (.shared.vs_code_extensions | type == "array") and
            (.shared.gh_cli_extensions | type == "array") and
            (.shared.pwa_sites | type == "array") and
            (.shared.mcp_servers | type == "array") and
            (.shared.gh_auth_scopes | type == "array") and
            (.shared.repos_to_clone | type == "array") and
            (.mac.packages.casks | type == "array") and
            (.mac.packages.formulas | type == "array") and
            (.mac.editors | type == "array") and
            (.mac.iterm2.light.color_preset | type == "string") and
            (.mac.iterm2.light.color_scheme_file | type == "string") and
            (.mac.iterm2.dark.color_preset | type == "string") and
            (.mac.iterm2.dark.color_scheme_file | type == "string") and
            (.mac.iterm2.font | type == "string") and
            (.mac.iterm2.theme | type == "string") and
            (.mac.iterm2.ligatures | type == "boolean") and
            (.mac.iterm2.thin_strokes | type == "string") and
            (.mac.monaspace_frozen_version | type == "string") and
            (.mac.post_install_launch | type == "array") and
            (.mac.dock_apps | type == "array") and
            (.windows.packages | type == "array") and
            (.windows.editors | type == "array") and
            (.windows.taskbar_pins | type == "array") and
            (.windows.post_install_launch | type == "array")
          ' config.json > /dev/null

  lint-bash:
    name: Lint bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint bash scripts
        run: shellcheck --severity=warning -x setup.sh install-demo-launcher.sh
      - name: Parse bash scripts
        run: bash -n setup.sh && bash -n install-demo-launcher.sh

  test-bash:
    name: Test bash
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trust aws Homebrew tap
        run: brew trust aws/tap
      - name: Install test dependencies
        run: brew install bats-core jq
      - name: Run Bats
        run: bats tests/bash

  lint-powershell:
    name: Lint PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path .\setup.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          Invoke-ScriptAnalyzer -Path .\install-demo-launcher.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in 'setup.ps1', 'install-demo-launcher.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

  test-powershell:
    name: Test PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -Repository PSGallery
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path .\tests\powershell -CI
